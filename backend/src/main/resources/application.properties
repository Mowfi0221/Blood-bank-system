spring.application.name=blood-bank-backend
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/blood_db
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
app.jwt.secret=BloodBankSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026Secure
app.jwt.expiration-ms=86400000

# OTP Configuration
app.otp.expiration-minutes=5
app.otp.max-attempts=3

# SMTP Mail Configuration (Override with environment variables or set credentials here)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Default Admin Seed Configuration
app.admin.default-username=admin
app.admin.default-password=admin123
